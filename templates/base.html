<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page_title %}{{ page_title }} · {% endif %}{{ p.name }}</title>
  <meta name="description" content="{{ p.name }}, {{ p.position }}, {{ p.affiliations[0] }}. {{ p.tagline }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ root }}assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap bar">
    <a class="brand" href="{{ root }}">{{ p.name }}</a>
    <nav class="menu">
      {% for key, label, href in menu %}
      <a href="{{ href if href.startswith('http') else root + href }}"{% if key == active %} class="on" aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
<main class="wrap main">
  {% block content %}{% endblock %}
</main>
<footer class="wrap"><div class="foot">© {{ year }} {{ p.name }} · {{ p.affiliations[0] }} · Last updated {{ updated }}</div></footer>
</body>
</html>
