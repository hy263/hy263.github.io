  - title: 'In Strongman We Trust: The Political Legacy of the New Village Movement in South Korea'
    coauthors: Jean Hong and Sunkyoung Park
    journal: American Journal of Political Science
    volume: '67'
    issue: 4
    pages: 850–866
    year: 2023
    award: 2023 Best Article Prize in the Study of Democracy & Autocracy
    doi_url: https://doi.org/10.1111/ajps.12716
    abstract: This study explores how authoritarian distributive policies may not only generate political support
      for the autocrat but may also help sustain powerful and lasting authoritarian legacies. We use microlevel
      data from South Korea’s New Village Movement, a 1970s rural development program implemented under dictator
      Park Chung-hee and widely touted as contributing to the country’s rapid economic development. Our analysis
      shows that townships in receipt of larger cash transfers cast more votes for Park’s incumbent party in the
      subsequent election. More importantly, we show that the effects of the subsidies still appeared almost four
      decades later in 2012, when the dictator’s daughter was democratically elected as the president of South Korea.
      We show that these effects were not driven by villagers’ long-term income gains or enhanced social capital
      due to the program but by the unwavering support of the beneficiary villagers for the dictator, whose legacy
      remained strong long after democratization.
- field: Multidisciplinary Sciences
  items:
  - title: A human-machine collaborative approach measures economic development using satellite imagery
    coauthors: Donghyun Ahn, Jeasurk Yang, Sungwon Han, Sungwon Park, Susang Lee, Jihee Kim, Sangyoon Park, and
      Meeyoung Cha
    journal: Nature Communications
    volume: '14'
    pages: Article 6811
    year: 2023
    doi_url: https://doi.org/10.1038/s41467-023-42122-8
    pdf: assets/papers/yang2023_naturecomm.pdf
    pdf_label: PDF (open access)
    abstract: Machine learning approaches using satellite imagery are providing accessible ways to infer socioeconomic
      measures without visiting a region. However, many algorithms require integration of ground-truth data, while
      regional data are scarce or even absent in many countries. Here we present our human-machine collaborative
      model which predicts grid-level economic development using publicly available satellite imagery and lightweight
      subjective ranking annotation without any ground data. We applied the model to North Korea and produced fine-grained
      predictions of economic development for the nation where data is not readily available. Our model suggests
      substantial development in the country’s capital and areas with state-led development projects in recent years.
      We showed the broad applicability of our model by examining five of the least developed countries in Asia,
      covering 400,000 grids. Our method can both yield highly granular economic information on hard-to-visit and
      low-resource regions and can potentially guide sustainable development programs.
  - title: 'Disaster assessment using computer vision and satellite imagery: Applications in detecting water-related
      building damages'
    coauthors: Danu Kim, Jeongkyung Won, Eunji Lee, Kyung Ryul Park, Jihee Kim, Sangyoon Park, and Meeyoung Cha
    journal: Frontiers in Environmental Science
    volume: '10'
    pages: Article 969758
    year: 2022
    doi_url: https://doi.org/10.3389/fenvs.2022.969758
    pdf: assets/papers/kim2022_frontiers.pdf
    pdf_label: PDF (open access)
    abstract: The increasing frequency and severity of water-related disasters such as floods, tornadoes, hurricanes,
      and tsunamis in low- and middle-income countries exemplify the uneven effects of global climate change. The
      vulnerability of high-risk societies to natural disasters has continued to increase. To develop an effective
      and efficient adaptation strategy, local damage assessments must be timely, exhaustive, and accurate. We propose
      a novel deep-learning-based solution that uses pairs of pre- and post-disaster satellite images to identify
      water-related disaster-affected regions. The model extracts features of pre- and post-disaster images and
      uses the feature difference with them to predict damage in the pair. We demonstrate that the model can successfully
      identify local destruction using less granular and less complex ground-truth data than those used by previous
      segmentation models. When tested with various water-related disasters, our detection model reported an accuracy
      of 85.9% in spotting areas with damaged buildings. It also achieved a reliable performance of 80.3% in out-of-domain
      settings. Our deep learning-based damage assessment model can help direct resources to areas most vulnerable
      to climate disasters, reducing their impacts while promoting adaptive capacities for climate-resilient development
      in the most vulnerable regions.
- field: Hospitality and Tourism
  items:
  - title: 'Effects of Visual Cues and Social Density on Beverage Consumption: A Field Experiment in a Bar'
    coauthors: Min Gyung Kim and Anna Mattila
    journal: Cornell Hospitality Quarterly
    volume: '63'
    issue: 2
    pages: 182–194
    year: 2022
    doi_url: https://doi.org/10.1177/1938965520985498
    abstract: We conducted a randomized controlled field study to explore the effectiveness of sensory marketing
      on beverage consumption patterns in a real bar setting. Specifically, we examined (a) the effect of visual
      elements (i.e., consumption-inducing text messages on coasters), (b) the effect of social density, and (c)
      the joint effect of visual elements and social density. We manipulated coaster type (visual consumption-inducing
      messages either present or absent), measured social density, and collected sales data. The results show that
      visual elements have a significant effect on beverage consumption, but social density does not. The joint
      effect between the two factors is significant such that the effect of visual elements is higher when social
      density is low. This study contributes to the sensory marketing literature by revealing the interaction between
      visual and spatial cues in a field setting.
  - title: 'Persistent effects of mega-events on local economies: an application of administrative big data'
    coauthors: Min Gyung Kim
    journal: Asia Pacific Journal of Tourism Research
    volume: 26
    issue: 12
    year: 2021
    doi_url: https://doi.org/10.1080/10941665.2021.1983625
    abstract: Do the effects of a mega-event on a local economy persist even after the event has ended? Using a
      novel administrative big data set of buildings in the host regions, we analyze the long-term effects of the
      2018 PyeongChang Olympics. For data collection, we converted building-level GIS data into a township-level
      data set. We used the synthetic control method which enables causal analysis even with a small number of treated
      units. Our analysis reveals that, despite a short-term increase in the number of local buildings due to the
      Olympics, effects did not persist 1 year after the event.
