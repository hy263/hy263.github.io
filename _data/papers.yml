  - title: The effects of South Korean Protestantism on human capital and female empowerment, 1930–2010
    coauthors: Yutaro Izumi and Sangyoon Park
    journal: Journal of Comparative Economics
    volume: '51'
    issue: 2
    pages: 422–438
    year: 2023
    doi_url: https://doi.org/10.1016/j.jce.2023.01.006
    abstract: We examine the short- and long-run effects of historical Protestant churches on human capital and
      female empowerment in South Korea by combining historical data on religious facilities and contemporary population
      census and social survey data. In the short run, we find a positive and significant effect of Protestant churches
      on women’s literacy and employment, but not on men’s. After almost a century, we find no strong relationship
      between historical Protestant churches and women’s educational attainment or economic and political empowerment.
  - title: 'Family clans and public goods: Evidence from the New Village Beautification Project in South Korea'
    journal: Journal of Development Economics
    volume: '136'
    pages: 34–50
    year: 2019
    award: 2019 Korean Economy Academic Research Award
    doi_url: https://doi.org/10.1016/j.jdeveco.2018.09.001
    abstract: Ethnic and linguistic heterogeneity are widely studied as determinants of social capital, conflict,
      and institutional quality. In many cultures, another important dimension of heterogeneity is family clan membership.
      I study the relationship between family clan diversity in South Korean villages and the voluntary production
      of public goods and contributions of private resources for village projects. Under the 1970–1971 New Village
      Beautification Project, the government distributed resources to each village for the production of village
      public goods. Subsequently, the government systematically evaluated how well these resources were applied.
      I combine these data with information on village family clan structures collected by the Japanese Colonial
      Government, as well as records of land donations for village projects between 1970 and 1980. I find an inverted-U-shaped
      effect of group heterogeneity on the improvement of public goods.
    links:
    - label: Data
      url: ../data/
