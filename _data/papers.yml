- title: Gambling for Goals
  coauthors: Costas Arkolakis, Spencer Y. Kwon, Dominic Russel, and Claire Shi
  links:
  - label: SSRN
    url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5761702
  - label: NBER draft
    url: https://conference.nber.org/conf_papers/f246418.pdf
  abstract: 'As young adults in advanced economies have become increasingly pessimistic about their economic prospects
    in recent years, gambling-like financial activities have proliferated. We link these trends through a Friedman-Savage
    (1948) motive: when life goals such as homeownership or marriage seem out of reach, individuals turn to financial
    gambles. We test the theory using an original survey combined with millions of linked records from Korea’s leading
    credit bureau, telecom provider, and credit card issuer. Consistent with the theory, individuals who place greater
    importance on hard-to-reach financial goals are more likely to exhibit risk-seeking preferences and to engage
    in high-risk investment. Conversely, when goals become attainable, risk-taking declines: exploiting Korea’s
    housing lottery, which quasi-randomly allocates subsidies for home purchase, we show that attaining homeownership
    reduces interest in cryptocurrency. We conclude with a stylized calibration that shows how goal-driven risk
    preferences can amplify the welfare costs of overoptimism.'
