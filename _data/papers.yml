- field: 'Economics: Korean history'
  items:
  - title: 'Inside the Reform: Patterns of Ex-ante Disposals of farmland in Anryong-myeon, Suwon, as Seen Through
      the Jise Myeonggijang'
    coauthors: Jongryong Park
    journal: Korean Culture (한국문화)
    volume: '114'
    pages: 289–318
    year: 2026
    note: In Korean
    doi_url: https://doi.org/10.22943/han.2026..114.009
    abstract: 'We analyze the sellers, buyers, and ownership-transfer patterns of ex-ante disposals, or pre-reform
      private land sales that occurred during the South Korean land reform of 1950. Our analysis is based on the
      Jise Myeonggijang, or land-tax registers, compiled in Anryong-myeon, old Suwon-gun. The redistribution of
      farmland during the South Korean land reform proceeded through three channels: the disposal of vested land
      (formerly Japanese-owned land), the purchase and distribution of Korean landlord-owned land under the Land
      Reform Act, and pre-reform private land sales between landlords and peasants. The ex-ante disposals accounted
      for over half of the redistributed tenanted land, amounting to approximately 710 thousand jeongbos, and have
      thus been treated as a major driver of the reform. Despite this magnitude, empirical analyses of the specific
      realities of these transactions seem to remain relatively scarce. To examine this issue, we trace parcel-level
      changes in land ownership in the Anryong area from 1943 to 1949. We find that land transactions in Anryong
      were concentrated around 1948, when the disposal of vested land was executed and the Land Reform Act was taking
      shape. Notably, a substantial share of pre-reform private land sales occurred within local same-surname kinship
      groups of the Park and Yun families. Furthermore, we find that ownership transfers through ex-ante disposals
      contributed more to the maintenance or expansion of landholdings by existing landowners than to land acquisition
      and upward mobility by the landless poor. These findings suggest that while the ex-ante disposals partially
      accelerated the dismantling of landlordism and the redistribution of tenanted land, they may also have constrained
      the land-to-tillers principle and the efficient allocation of resources. Furthermore, this study suggests
      that when analyzing the long-term impacts of the land reform on rural societies, future research should consider
      that even if the total apparent scale of redistribution was similar, the relative proportion of ex-ante disposals
      versus legal redistribution may have carried significantly different implications for the local economy.'
  - title: 'Measuring Historical Settlement and Agricultural Structure from Topographic Maps: An Object Detection
      Approach for South Korea, 1918 and 1970'
    coauthors: Izzat Hassan Bin Halim and Jeongeun Kim
    journal: 'Kyungje Sahak: Review of Economic History (경제사학)'
    volume: '50'
    issue: 2
    pages: 99–138
    year: 2026
    abstract: We construct a new grid-level historical dataset for South Korea by applying YOLO-based object detection
      to 1:50,000-scale topographic maps from 1918 and 1970, yielding 1 km×1 km counts of residential houses, rice
      paddies, and other annotated land-use symbols on the Korean national standard grid. The house variable captures
      the standardized small-square symbol used for individual rural dwellings and should be interpreted as a measure
      of dispersed rural settlement rather than total housing stock. Internal consistency checks, a cell-level temporal-persistence
      test between 1918 and 1970, and an external cross-check against the 1930 colonial census at the township level
      support the dataset’s use as a baseline spatial measure of rural settlement and agricultural land use. The
      dataset is made publicly available, providing a new resource for long-run regional analysis in Korean economic
      history.
