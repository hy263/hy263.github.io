  - title: Fine-Grained Socioeconomic Prediction from Satellite Images with Distributional Adjustment
    coauthors: Donghyun Ahn, Minhyuk Song, Seungeon Lee, Yubin Choi, Jihee Kim, Sangyoon Park, and Meeyoung Cha
    journal: Proceedings of the 32nd ACM International Conference on Information and Knowledge Management (CIKM
      ’23)
    pages: 3717–3721
    year: 2023
    doi_url: https://doi.org/10.1145/3583780.3615226
    abstract: While measuring socioeconomic indicators is critical for local governments to make informed policy
      decisions, such measurements are often unavailable at fine-grained levels like municipality. This study employs
      deep learning-based predictions from satellite images to close the gap. We propose a method that assigns a
      socioeconomic score to each satellite image by capturing the distributional behavior observed in larger areas
      based on the ground truth. We train an ordinal regression scoring model and adjust the scores to follow the
      common power law within and across regions. Evaluation based on official statistics in South Korea shows that
      our method outperforms previous models in predicting population and employment size at both the municipality
      and grid levels. Our method also demonstrates robust performance in districts with uneven development, suggesting
      its potential use in developing countries where reliable, fine-grained data is scarce.
  - title: Learning Economic Indicators by Aggregating Multi-Level Geospatial Information
    coauthors: Sungwon Park, Sungwon Han, Donghyun Ahn, Jaeyeon Kim, Jeasurk Yang, Susang Lee, Seunghoon Hong, Jihee
      Kim, Sangyoon Park, and Meeyoung Cha
    journal: Proceedings of the AAAI Conference on Artificial Intelligence (AAAI-22)
    volume: 36
    issue: 11
    pages: 12053–12061
    year: 2022
    abstract: High-resolution daytime satellite imagery has become a promising source to study economic activities.
      These images display detailed terrain over large areas and allow zooming into smaller neighborhoods. Existing
      methods, however, have utilized images only in a single-level geographical unit. This research presents a
      deep learning model to predict economic indicators via aggregating traits observed from multiple levels of
      geographical units. The model first measures hyperlocal economy over small communities via ordinal regression.
      The next step extracts district-level features by summarizing interconnection among hyperlocal economies.
      In the final step, the model estimates economic indicators of districts via aggregating the hyperlocal and
      district information. Our new multi-level learning model substantially outperforms strong baselines in predicting
      key indicators such as population, purchasing power, and energy consumption. The model is also robust against
      data shortage; the trained features from one country can generalize to other countries when evaluated with
      data gathered from Malaysia, the Philippines, Thailand, and Vietnam. We discuss the multi-level model’s implications
      for measuring inequality, which is the essential first step in policy and social science research on inequality
      and poverty.
    links:
    - label: Journal
      url: https://doi.org/10.1609/aaai.v36i11.21464
  - title: Learning to Score Economic Development from Satellite Imagery
    coauthors: Sungwon Han, Donghyun Ahn, Sungwon Park, Jeasurk Yang, Susang Lee, Jihee Kim, Sangyoon Park, and
      Meeyoung Cha
    journal: Proceedings of the 26th ACM SIGKDD Conference on Knowledge Discovery and Data Mining (KDD ’20)
    pages: 2970–2979
    year: 2020
    doi_url: https://doi.org/10.1145/3394486.3403347
    pdf: assets/papers/han2020_kdd.pdf
    pdf_label: PDF (open access)
    abstract: Reliable and timely measurements of economic activities are fundamental for understanding economic
      development and designing government policies. However, many developing countries still lack reliable data.
      In this paper, we introduce a novel approach for measuring economic development from high-resolution satellite
      images in the absence of ground truth statistics. Our method consists of three steps. First, we run a clustering
      algorithm on satellite images that distinguishes artifacts from nature (siCluster). Second, we generate a
      partial order graph of the identified clusters based on the level of economic development, either by human
      guidance or by low-resolution statistics (siPog). Third, we use a CNN-based sorter that assigns differentiable
      scores to each satellite grid based on the relative ranks of clusters (siScore). The novelty of our method
      is that we break down a computationally hard problem into sub-tasks, which involves a human-in-the-loop solution.
      With the combination of unsupervised learning and the partial orders of dozens of urban vs. rural clusters,
      our method can estimate the economic development scores of over 10,000 satellite grids consistently with other
      baseline development proxies (Spearman correlation of 0.851). This efficient method is interpretable and robust;
      we demonstrate how to apply our method to both developed (e.g., South Korea) and developing economies (e.g.,
      Vietnam and Malawi).
