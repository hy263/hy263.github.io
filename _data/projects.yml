- title: Research Center for Big Data on Korean Economy
  subtitle: College of Economics, Sogang University
  description: >-
    The center was founded in March 2025 under a memorandum of understanding between the College of
    Economics at Sogang University and the Department of Economics at Yale University. It hosts
    restricted-access Korean microdata on secure servers and supports research that uses these data,
    including joint work with researchers at Yale and Brown on household debt and on fertility.
    Access to the data is by application, reviewed for confidentiality and research relevance.
  people:
  - role: Director
    names: [Jungsoo Park (Sogang University)]
  - role: Co-directors
    names: [Costas Arkolakis (Yale University), Hyunjoo Yang (Sogang University)]
  - role: Head of research
    names: [Jun Hee Kwak (Sogang University)]
- title: 'Institutional Design for an Inclusive Energy Transition'
  subtitle: Social Science Korea (SSK) Global Agenda Project, National Research Foundation of Korea, 2026–2030
  description: >-
    Renewable energy spreads its benefits across a whole country, but its costs often fall on the
    places where plants and power lines are built. This project asks which institutions make the
    energy transition work for those places: resident participation, benefit sharing, community
    ownership, support for low-income households, and the role of local governments. We compare
    policies in the United States, Germany, Australia, Brazil, India and South Africa with those in
    Korea, and we measure their long-run effects on local jobs, public finances and population using
    regional panel data, GIS and satellite data.
  people:
  - role: Principal investigator
    names: [Hyunjoo Yang (Sogang University)]
  - role: Co-investigators
    names: [Jeasurk Yang (Chonnam National University), Solomon Hsiang (Stanford University),
            Michael Anderson (UC Berkeley), Marco Gonzalez-Navarro (UC Berkeley)]
