- title: Sogang Spatial Economics & AI Lab
  subtitle: A small lab at Sogang University
  description: >-
    The lab works at the intersection of geospatial data, economics and machine learning. We build
    new data from historical maps, archival records and satellite images, and use them to study
    Korea's development.
