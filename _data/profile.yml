name: Hyunjoo Yang
position: Associate Professor of Economics
affiliations:
  - College of Economics, Sogang University, South Korea
  - Graduate School of Artificial Intelligence (Affiliated faculty)
email_display: hyang (at) sogang.ac.kr
tagline: "A research integrator and a builder of new data for understanding Korea's development."
bio: >-
  Hyunjoo Yang examines Korea's long-run development and contemporary economic challenges using newly
  constructed historical, administrative, spatial, and digital data. His methodology combines applied
  microeconomics with GIS, machine learning, and interdisciplinary collaboration to study institutions,
  political legacies, regional development, and household behavior.
interests: Korean economic history, political economy, spatial economics, applied microeconomics, machine learning, and data construction
education:
  - PhD in Economics, Brown University (2016)
  - MSc in Economics, London School of Economics (2010)
  - BA in Trade and Commerce, Incheon National University (2008)
